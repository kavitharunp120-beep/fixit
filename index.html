<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FixIt – Hostel maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1b33;--mute:#5b6784;--line:#dbe2ef;--brand:#1d4ed8;--brand-ink:#fff;--u1:#3b82f6;--u2:#14b8a6;--u3:#f59e0b;--u4:#f97316;--u5:#dc2626;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c30;--ink:#e8edf8;--mute:#93a0bd;--line:#26324d;--brand:#5b8cff;--brand-ink:#0b1220}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c30;--ink:#e8edf8;--mute:#93a0bd;--line:#26324d;--brand:#5b8cff;--brand-ink:#0b1220}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
.logo{font:800 26px 'Bricolage Grotesque',sans-serif;letter-spacing:-.5px}
.logo small{display:block;font:500 13px Figtree,sans-serif;color:var(--mute);letter-spacing:0}
nav{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{border:0;background:none;color:var(--mute);font:600 14px Figtree,sans-serif;padding:8px 16px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{font-size:30px;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 18px}
label,.lab{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;min-height:120px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);cursor:pointer;text-align:center;color:var(--mute);overflow:hidden}
.drop img{max-width:100%;max-height:220px;display:block}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 6px;font:600 14px Figtree,sans-serif;cursor:pointer}
.cats button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.btn{border:0;border-radius:10px;padding:13px 18px;font:700 16px Figtree,sans-serif;cursor:pointer;background:var(--brand);color:var(--brand-ink);width:100%;margin-top:18px}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand);margin-top:10px}
.sug{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.sug b{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat strong{display:block;font:800 30px 'Bricolage Grotesque',sans-serif}
.stat span{font-size:13px;color:var(--mute)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.chart h3{font-size:17px;margin-bottom:10px}
.bar{display:grid;grid-template-columns:64px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px Figtree,sans-serif;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.issue{display:grid;grid-template-columns:8px 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.issue .st{background:var(--u3)}
.issue .in{padding:14px;display:grid;gap:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top h3{font-size:20px}
.pill{flex:none;border-radius:999px;padding:3px 10px;font:700 13px Figtree,sans-serif;color:#fff}
.meta{color:var(--mute);font-size:14px}
.cnt{font-weight:700;color:var(--ink)}
.issue img{width:100%;max-height:180px;object-fit:cover;border-radius:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 4px;font:600 13px Figtree,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:30px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:90%}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;font-size:13px;color:var(--mute)}
.foot button{background:none;border:0;color:var(--brand);font:600 13px Figtree,sans-serif;cursor:pointer;text-decoration:underline}
.adm{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.adm input{width:110px;padding:8px 10px}
.adm button{border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:600 13px Figtree,sans-serif;padding:9px 14px;cursor:pointer}
[hidden]{display:none!important}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.panel h2{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">FixIt<small>Hostel maintenance, EPCET</small></div>
  <nav role="tablist"><button role="tab" id="t-report" aria-selected="true">Report</button><button role="tab" id="t-dash" aria-selected="false">Dashboard</button></nav>
</header>

<section id="v-report" class="panel">
  <h2>Something broken?</h2>
  <p class="sub">Add a photo and the location. The hostel team sees every report instantly.</p>
  <div class="lab">Photo of the problem</div>
  <label class="drop" for="photo" id="drop" style="margin:0;font-weight:500"><span><b>Tap to add a photo</b></span><span>Blurry is fine, it still helps</span></label>
  <input id="photo" type="file" accept="image/*" hidden>
  <div class="row">
    <div><label for="block">Block</label><select id="block"><option>Block A</option><option>Block B</option><option>Block C</option><option>Block D</option></select></div>
    <div><label for="room">Room number</label><input id="room" inputmode="numeric" placeholder="e.g. 214"></div>
  </div>
  <div class="lab">What is the problem?</div>
  <div class="cats" id="cats"></div>
  <label for="note">Short note</label>
  <textarea id="note" placeholder="e.g. Tap is leaking and water is on the floor"></textarea>
  <button class="btn ghost" id="suggest" type="button">Auto-suggest urgency</button>
  <div class="sug" id="sug" hidden></div>
  <button class="btn" id="send" type="button">Send report</button>
</section>

<section id="v-dash" hidden>
  <div class="adm" id="adm"></div>
  <div class="stats" id="stats"></div>
  <div class="chart"><h3>Reports by block</h3><div id="chart"></div></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</section>

<div class="foot"><span>Reports are saved in this browser for the demo.</span><button id="reset" type="button">Reset demo data</button></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var KEY='fixit-demo-v1',CATS=['Fan','Light','Water','Washroom','Wi-Fi','Other'],BASE={Fan:2,Light:2,Water:3,Washroom:3,'Wi-Fi':2,Other:2};
var mem=null;
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem}
function save(d){mem=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function urg(cat,note){
  var n=(note||'').toLowerCase(),u=BASE[cat]||2;
  if(/spark|shock|fire|smoke|flood|burn/.test(n))return 5;
  if(/leak|overflow|no water|water on|dark|stuck|broken|not working|dead/.test(n))u++;
  return Math.min(u,5);
}
function seed(){
  var R=[['Block A','214','Fan','Ceiling fan not rotating at all','Open'],['Block A','218','Fan','Fan makes loud noise and wobbles','Open'],['Block A','305','Fan','Fan speed regulator is broken','Open'],
  ['Block B','108','Water','Tap leaking continuously, water on the floor','Open'],['Block B','110','Water','Bathroom tap leaking since morning','Open'],['Block B','116','Water','No water in the bathroom tap','Open'],
  ['Block C','220','Light','Corridor light is dead, very dark at night','In progress'],['Block C','224','Light','Corridor light not working','In progress'],
  ['Block D','301','Wi-Fi','Wi-Fi keeps disconnecting in the evening','Open'],['Block D','305','Wi-Fi','No Wi-Fi signal in the room','Open'],['Block D','312','Wi-Fi','Wi-Fi very slow, not working for classes','Open'],
  ['Block A','Ground floor','Washroom','Washroom not cleaned, bad smell','Open'],['Block C','1st floor','Washroom','Washroom door lock broken','Open'],
  ['Block B','205','Other','Window latch is broken','Fixed'],['Block D','410','Light','Tube light flickering','In progress']];
  return R.map(function(r,i){return{id:'s'+i,block:r[0],room:r[1],cat:r[2],note:r[3],urgency:urg(r[2],r[3]),photo:'',status:r[4],mine:false}});
}
function data(){var d=load();if(!d){d=seed();save(d)}return d}
function group(d){
  var m={};
  d.forEach(function(r){var k=r.block+'|'+r.cat;(m[k]=m[k]||{block:r.block,cat:r.cat,items:[]}).items.push(r)});
  return Object.keys(m).map(function(k){
    var g=m[k],mx=Math.max.apply(null,g.items.map(function(r){return r.urgency}));
    g.urgency=Math.min(5,mx+Math.floor((g.items.length-1)/2));
    var sts=g.items.map(function(r){return r.status});
    g.status=sts.every(function(s){return s==='Fixed'})?'Fixed':sts.indexOf('In progress')>-1?'In progress':'Open';
    g.photo=(g.items.filter(function(r){return r.photo})[0]||{}).photo||'';
    g.note=g.items[g.items.length-1].note;
    return g;
  });
}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var cat='',photo='',filter='All',PIN='1234',isAdmin=false;try{isAdmin=sessionStorage.getItem('fixit-admin')==='1'}catch(e){}
// tabs
function show(t){
  $('v-report').hidden=t!=='report';$('v-dash').hidden=t!=='dash';
  $('t-report').setAttribute('aria-selected',t==='report');$('t-dash').setAttribute('aria-selected',t==='dash');
  if(t==='dash')renderDash();
  try{history.replaceState(null,'',t==='dash'?'#dashboard':'#report')}catch(e){}
}
$('t-report').onclick=function(){show('report')};$('t-dash').onclick=function(){show('dash')};
// category buttons
$('cats').innerHTML=CATS.map(function(c){return'<button type="button" aria-pressed="false" data-c="'+c+'">'+c+'</button>'}).join('');
$('cats').onclick=function(e){var b=e.target.closest('button');if(!b)return;cat=b.dataset.c;
  [].forEach.call($('cats').children,function(x){x.setAttribute('aria-pressed',x===b)})};
// photo
$('photo').onchange=function(){
  var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,360/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.6);
    $('drop').innerHTML='<img alt="Selected photo of the problem" src="'+photo+'">'};im.src=rd.result};
  rd.readAsDataURL(f);
};
// suggest
$('suggest').onclick=function(){
  if(!cat){toast('Pick a problem type first');return}
  var u=urg(cat,$('note').value),el=$('sug');el.hidden=false;
  el.innerHTML='<b>Suggested urgency: '+u+' of 5.</b> '+esc(cat)+' issue'+($('note').value?': '+esc($('note').value.slice(0,80)):'')+'. Reports from the same block merge into one card.';
};
// send
$('send').onclick=function(){
  var room=$('room').value.trim();
  if(!room){toast('Add your room number');$('room').focus();return}
  if(!cat){toast('Pick a problem type');return}
  var d=data(),note=$('note').value.trim()||cat+' problem';
  d.push({id:'r'+Date.now(),block:$('block').value,room:room,cat:cat,note:note,urgency:urg(cat,note),photo:photo,status:'Open',mine:true});
  save(d);
  cat='';photo='';$('room').value='';$('note').value='';$('sug').hidden=true;
  $('drop').innerHTML='<span><b>Tap to add a photo</b></span><span>Blurry is fine, it still helps</span>';
  [].forEach.call($('cats').children,function(x){x.setAttribute('aria-pressed','false')});
  toast('Report sent. Open the Dashboard to see it.');
};
// dashboard
function renderAdm(){$('adm').innerHTML=isAdmin?'<span><b>Admin mode on.</b> You can change any status.</span><button type="button" id="alo">Log out</button>':'<span>Admin? Enter the PIN to manage all issues.</span><span><input id="pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="Admin PIN"> <button type="button" id="ali">Unlock</button></span>'}
function renderDash(){renderAdm();
  var d=data(),g=group(d);
  var open=g.filter(function(x){return x.status!=='Fixed'}),urgent=open.filter(function(x){return x.urgency>=4}).length;
  var fixed=g.filter(function(x){return x.status==='Fixed'}).length;
  $('stats').innerHTML=[[d.length,'Reports'],[open.length,'Open issues'],[urgent,'Urgent'],[fixed,'Fixed']].map(function(s){return'<div class="stat"><strong>'+s[0]+'</strong><span>'+s[1]+'</span></div>'}).join('');
  var bl=['Block A','Block B','Block C','Block D'],cn=bl.map(function(b){return d.filter(function(r){return r.block===b}).length}),mx=Math.max.apply(null,cn.concat([1]));
  $('chart').innerHTML=bl.map(function(b,i){return'<div class="bar"><span>'+b+'</span><i style="width:'+Math.max(4,cn[i]/mx*100)+'%"></i><span>'+cn[i]+'</span></div>'}).join('');
  $('chips').innerHTML=['All','Open','In progress','Fixed'].map(function(f){return'<button type="button" data-f="'+f+'" aria-pressed="'+(f===filter)+'">'+f+'</button>'}).join('');
  var L=g.filter(function(x){return filter==='All'||x.status===filter}).sort(function(a,b){return(a.status==='Fixed')-(b.status==='Fixed')||b.urgency-a.urgency||b.items.length-a.items.length});
  var col=['','var(--u1)','var(--u2)','var(--u3)','var(--u4)','var(--u5)'];
  $('list').innerHTML=L.length?L.map(function(x){
    var rooms=x.items.map(function(r){return esc(r.room)}).join(', '),n=x.items.length;
    return'<article class="issue"><div class="st" style="background:'+col[x.urgency]+'"></div><div class="in"><div class="top"><h3>'+esc(x.cat)+' · '+esc(x.block)+'</h3><span class="pill" style="background:'+col[x.urgency]+'">Urgency '+x.urgency+'/5</span></div>'+
    (x.photo?'<img alt="Photo of the reported problem" src="'+x.photo+'">':'')+
    '<div>'+esc(x.note)+'</div><div class="meta"><span class="cnt">'+(n>1?n+' students reported this':'1 student reported this')+'</span> · Rooms '+rooms+'</div>'+
    (isAdmin||x.items[0].mine?'<div class="seg" data-k="'+esc(x.block+'|'+x.cat)+'">'+['Open','In progress','Fixed'].map(function(s){return'<button type="button" data-s="'+s+'" aria-pressed="'+(x.status===s)+'">'+s+'</button>'}).join('')+'</div>':'<div class="meta">Status: <b>'+x.status+'</b> · only the reporter and admin can change this</div>')+'</div></article>';
  }).join(''):'<div class="empty">Nothing here yet. Send a report to see it appear.</div>';
}
$('chips').onclick=function(e){var b=e.target.closest('button');if(b){filter=b.dataset.f;renderDash()}};
$('adm').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id==='ali'){if($('pin').value===PIN){isAdmin=true;try{sessionStorage.setItem('fixit-admin','1')}catch(x){}renderDash();toast('Admin mode on')}else{toast('Wrong PIN')}}
  if(b.id==='alo'){isAdmin=false;try{sessionStorage.removeItem('fixit-admin')}catch(x){}renderDash()}};
$('list').onclick=function(e){
  var b=e.target.closest('button');if(!b||!b.parentNode.dataset.k)return;var k=b.parentNode.dataset.k.split('|'),d=data();var first=d.filter(function(r){return r.block===k[0]&&r.cat===k[1]})[0];if(!isAdmin&&!(first&&first.mine))return;
  d.forEach(function(r){if(r.block===k[0]&&r.cat===k[1])r.status=b.dataset.s});
  save(d);renderDash();
};
$('reset').onclick=function(){save(seed());renderDash();toast('Demo data restored')};
var tt;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}
show(location.hash==='#dashboard'?'dash':'report');
})();
</script>
</body>
</html>
